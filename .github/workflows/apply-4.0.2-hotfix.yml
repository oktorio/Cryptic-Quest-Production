name: Apply 4.0.2 modular clock hotfix

on:
  push:
    branches: ["hotfix/4.0.2-modular-clock"]
    paths:
      - ".github/workflows/apply-4.0.2-hotfix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v7
        with:
          ref: hotfix/4.0.2-modular-clock
      - name: Apply patch
        run: python3 scripts/apply-4.0.2-hotfix.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add styles.css package.json index.html sw.js RELEASE_NOTES.md
          git commit -m "fix: repair modular clock positioning" || exit 0
          git push origin HEAD:hotfix/4.0.2-modular-clock
