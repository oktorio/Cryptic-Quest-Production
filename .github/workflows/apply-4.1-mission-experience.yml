name: Apply 4.1 Mission Experience

on:
  push:
    branches: ["release/4.1-mission-experience"]
    paths:
      - ".github/workflows/apply-4.1-mission-experience.yml"
      - "scripts/apply-4.1-mission-experience.py"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 4.1 branch
        uses: actions/checkout@v7
        with:
          ref: release/4.1-mission-experience
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Apply Mission Experience patch
        run: python3 scripts/apply-4.1-mission-experience.py
      - name: Run static and regression checks
        run: npm run check
      - name: Commit 4.1 implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js js/mission-experience.js styles.css package.json index.html sw.js tests/test.mjs tests/browser-smoke.mjs README.md RELEASE_NOTES.md
          git commit -m "feat: implement Mission Experience 2.0" || exit 0
          git push origin HEAD:release/4.1-mission-experience
